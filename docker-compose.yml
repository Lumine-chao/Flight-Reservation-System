services:
  redis:
    image: redis:7-alpine
    container_name: fr-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fr-backend
    restart: unless-stopped
    environment:
      DB_URL: sqlite:////data/flight.db
      REDIS_URL: redis://redis:6379/0
      FORCE_MEMORY_CACHE: "false"
      CUSTOMER_JWT_SECRET: flight-customer-secret-change-me
      ADMIN_JWT_SECRET: flight-admin-secret-change-me
      TZ: Asia/Shanghai
    volumes:
      - sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: fr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  sqlite_data:
  redis_data:
