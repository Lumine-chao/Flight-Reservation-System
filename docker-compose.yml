services:
  mysql:
    image: mysql:8.0
    container_name: fr-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: flight_reservation
      MYSQL_USER: flight
      MYSQL_PASSWORD: flight123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fr-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: fr-backend
    restart: unless-stopped
    environment:
      DB_URL: mysql+pymysql://flight:flight123456@mysql:3306/flight_reservation?charset=utf8mb4
      REDIS_URL: redis://redis:6379/0
      FORCE_MEMORY_CACHE: "false"
      CUSTOMER_JWT_SECRET: flight-customer-secret-change-me
      ADMIN_JWT_SECRET: flight-admin-secret-change-me
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: fr-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
  redis_data:
